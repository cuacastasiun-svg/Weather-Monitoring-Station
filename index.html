<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Weather Station</title>
    <!-- Memanggil Chart.js dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f7f6; }
        
        /* Sidebar Menu */
        .sidebar { width: 250px; background-color: #2c3e50; color: white; padding-top: 20px; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; font-size: 1.2rem; }
        .menu-btn { width: 100%; padding: 15px 20px; border: none; background: none; color: white; text-align: left; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        .menu-btn:hover, .menu-btn.active { background-color: #34495e; border-left: 4px solid #3498db; }
        
        /* Konten Utama */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .page { display: none; animation: fadeIn 0.5s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Kartu Realtime */
        .card-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; min-width: 200px; text-align: center; }
        .card h3 { color: #7f8c8d; font-size: 1rem; margin-bottom: 10px; }
        .card .value { font-size: 2.5rem; font-weight: bold; color: #2c3e50; }
        
        /* Tabel Histori */
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #3498db; color: white; }
        tr:hover { background-color: #f1f1f1; }
        
        /* Grafik Container */
        .chart-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px;}
    </style>
</head>
<body>

    <!-- Sidebar Menu -->
    <div class="sidebar">
        <h2>🌤️ Weather Station</h2>
        <button class="menu-btn active" onclick="showPage('page1', this)">📡 Data Realtime</button>
        <button class="menu-btn" onclick="showPage('page2', this)">📈 Grafik Data</button>
        <button class="menu-btn" onclick="showPage('page3', this)">📜 Histori Data</button>
    </div>

    <!-- Konten Utama -->
    <div class="main-content">
        
        <!-- PAGE 1: Data Realtime -->
        <div id="page1" class="page active">
            <h2>Monitoring Realtime</h2>
            <br>
            <div class="card-container">
                <div class="card">
                    <h3>Suhu (°C)</h3>
                    <div class="value" id="val-temp">--</div>
                </div>
                <div class="card">
                    <h3>Kelembapan (%)</h3>
                    <div class="value" id="val-hum">--</div>
                </div>
                <div class="card">
                    <h3>Tekanan Udara (hPa)</h3>
                    <div class="value" id="val-pres">--</div>
                </div>
            </div>
        </div>

        <!-- PAGE 2: Grafik Data -->
        <div id="page2" class="page">
            <h2>Grafik Cuaca</h2>
            <div class="chart-container">
                <canvas id="weatherChart"></canvas>
            </div>
        </div>

        <!-- PAGE 3: Histori Data -->
        <div id="page3" class="page">
            <h2>Histori Log Data</h2>
            <br>
            <table>
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>Suhu (°C)</th>
                        <th>Kelembapan (%)</th>
                        <th>Tekanan Udara (hPa)</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <!-- Data histori akan masuk ke sini -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // --- NAVIGASI ANTAR PAGE ---
        function showPage(pageId, element) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            element.classList.add('active');
        }

        // --- INISIALISASI GRAFIK (CHART.JS) ---
        const ctx = document.getElementById('weatherChart').getContext('2d');
        const weatherChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], 
                datasets: [
                    { label: 'Suhu (°C)', borderColor: '#e74c3c', data: [], fill: false },
                    { label: 'Kelembapan (%)', borderColor: '#3498db', data: [], fill: false }
                ]
            },
            options: { responsive: true, scales: { x: { display: true }, y: { display: true } } }
        });

        // --- SIMULASI PENERIMAAN DATA SENSOR ---
        setInterval(() => {
            const waktu = new Date().toLocaleTimeString('id-ID');
            const suhu = (Math.random() * (35 - 20) + 20).toFixed(1);
            const kelembapan = (Math.floor(Math.random() * (90 - 50) + 50));
            const tekanan = (Math.floor(Math.random() * (1020 - 1000) + 1000));

            document.getElementById('val-temp').innerText = suhu;
            document.getElementById('val-hum').innerText = kelembapan;
            document.getElementById('val-pres').innerText = tekanan;

            if (weatherChart.data.labels.length > 10) {
                weatherChart.data.labels.shift();
                weatherChart.data.datasets[0].data.shift();
                weatherChart.data.datasets[1].data.shift();
            }
            weatherChart.data.labels.push(waktu);
            weatherChart.data.datasets[0].data.push(suhu);
            weatherChart.data.datasets[1].data.push(kelembapan);
            weatherChart.update();

            const historyBody = document.getElementById('history-body');
            const newRow = `<tr>
                <td>${waktu}</td>
                <td>${suhu}</td>
                <td>${kelembapan}</td>
                <td>${tekanan}</td>
            </tr>`;
            historyBody.insertAdjacentHTML('afterbegin', newRow);

        }, 3000);
    </script>
</body>
</html>
